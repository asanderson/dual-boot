name: container-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck + PowerShell parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint shell scripts
        run: shellcheck -x -S warning devices/*/scripts/*.sh common/*/scripts/*.sh common/lib/common.sh test/*.sh
      - name: Parse Windows rollback script
        run: |
          pwsh -NoProfile -Command '
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              "common/windows-to-ubuntu/windows/rollback-ubuntu.ps1", [ref]$null, [ref]$errs)
            if ($errs) { $errs; exit 1 } else { "ps1 syntax OK" }'

  kernel-test:
    name: unattended modes in fresh Ubuntu 26.04
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run mode assertions in a fresh container
        # Asserts: (1) unattended 20-kernel.sh without --check-releases skips
        # release checks and installs nothing; (2) with --check-releases it
        # runs the Ubuntu release check and installs the newest packaged
        # kernel; (3) the device driver script fails gracefully with no GPU;
        # (4) the Mac device script refuses to run on non-Apple hardware;
        # (5) the macOS-side OCLP script refuses to run on Linux.
        run: ./test/container-test.sh

  gpu-path:
    name: GPU-present driver install (stubbed RTX 5090)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run driver GPU-path test in a fresh container
        # An lspci stub exposes the MSI Raider 18's RTX 5090 so
        # 10-nvidia-driver.sh's GPU-present path runs for real: Secure Boot
        # messaging, the actual nvidia driver package install from the
        # Ubuntu archive, the CUDA-toolkit prompt taking its default no,
        # and all three driver-selection branches (versions.env fallback,
        # non-open recommendation upgraded to -open, -open recommendation
        # as-is). Validates selection + install machinery, not module
        # loading — that needs the real hardware.
        run: ./test/container-test.sh --gpu-path
